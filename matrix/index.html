<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matrix">
  <title>Matrix Azul</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: block;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 10px 18px;
      border: 1px solid rgba(80, 170, 255, 0.5);
      border-radius: 999px;
      background: rgba(0, 10, 30, 0.7);
      color: #8fd0ff;
      font: 14px/1.2 ui-monospace, "Courier New", monospace;
      letter-spacing: 0.05em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.8s ease;
      text-shadow: 0 0 6px #1e90ff;
    }

    #hint.hidden { opacity: 0; }

    body.idle { cursor: none; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div id="hint">Toca o haz doble clic para pantalla completa</div>

  <script>
    (() => {
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d', { alpha: false });
      const hint = document.getElementById('hint');

      // Caracteres: katakana de media anchura + números + algunos símbolos
      const CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>¦｜';

      // Paleta azul
      const HEAD_COLOR  = '#e6f6ff'; // punta brillante
      const TRAIL_COLOR = '#1e90ff'; // cuerpo de la columna
      const GLOW_COLOR  = '#3aa8ff';
      const FADE        = 'rgba(0, 4, 12, 0.08)'; // estela

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let width, height, dpr, fontSize, columns, drops, speeds;
      let lastTime = 0;
      let running = true;

      function setup() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Mobile-first: fuente que escala con el ancho de pantalla
        fontSize = Math.round(Math.max(14, Math.min(22, width / 40)));
        columns = Math.ceil(width / fontSize);

        drops = new Array(columns);
        speeds = new Array(columns);
        for (let i = 0; i < columns; i++) {
          drops[i] = Math.random() * -(height / fontSize); // arranque escalonado
          speeds[i] = 0.6 + Math.random() * 0.6;
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${fontSize}px ui-monospace, "MS Gothic", "Courier New", monospace`;
        ctx.textBaseline = 'top';
      }

      function randomChar() {
        return CHARS.charAt(Math.floor(Math.random() * CHARS.length));
      }

      function draw(time) {
        if (!running) return;
        requestAnimationFrame(draw);

        // ~30 fps (más lento si el usuario prefiere menos movimiento)
        const interval = reducedMotion ? 90 : 33;
        if (time - lastTime < interval) return;
        lastTime = time;

        ctx.fillStyle = FADE;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < columns; i++) {
          const x = i * fontSize;
          const y = Math.floor(drops[i]) * fontSize;

          if (y >= 0) {
            // Repinta el carácter anterior en azul para que la punta quede blanca
            ctx.shadowBlur = 0;
            ctx.fillStyle = TRAIL_COLOR;
            ctx.fillText(randomChar(), x, y - fontSize);

            ctx.shadowColor = GLOW_COLOR;
            ctx.shadowBlur = 8;
            ctx.fillStyle = HEAD_COLOR;
            ctx.fillText(randomChar(), x, y);
          }

          drops[i] += speeds[i];

          if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
            speeds[i] = 0.6 + Math.random() * 0.6;
          }
        }
        ctx.shadowBlur = 0;
      }

      // ---------- Pantalla completa ----------
      function isFullscreen() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      function toggleFullscreen() {
        const el = document.documentElement;
        if (!isFullscreen()) {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) req.call(el).catch?.(() => {});
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      }

      // Desktop: doble clic. Móvil: un toque.
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      if (isTouch) {
        canvas.addEventListener('click', toggleFullscreen);
      } else {
        canvas.addEventListener('dblclick', toggleFullscreen);
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      });

      // iPhone no soporta Fullscreen API: sugerir "Agregar a inicio"
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const standalone = window.navigator.standalone === true ||
                         window.matchMedia('(display-mode: standalone)').matches;
      if (isIOS && !standalone) {
        hint.textContent = 'Compartir → "Agregar a inicio" para pantalla completa';
      } else if (!isTouch) {
        hint.textContent = 'Doble clic o tecla F para pantalla completa';
      }
      if (standalone) hint.classList.add('hidden');
      setTimeout(() => hint.classList.add('hidden'), 5000);

      // ---------- Mantener la pantalla encendida ----------
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (_) { /* no soportado o denegado */ }
      }
      requestWakeLock();
      document.addEventListener('click', requestWakeLock, { once: true });

      // ---------- Pausar en segundo plano ----------
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          running = false;
        } else {
          running = true;
          requestWakeLock();
          requestAnimationFrame(draw);
        }
      });

      // ---------- Ocultar cursor si está inactivo ----------
      let idleTimer;
      document.addEventListener('mousemove', () => {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
      });

      // ---------- Resize / rotación ----------
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(setup, 150);
      });

      setup();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
