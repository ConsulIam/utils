<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matrix">
  <title>Matrix Azul</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: block;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 10px 18px;
      border: 1px solid rgba(80, 170, 255, 0.5);
      border-radius: 999px;
      background: rgba(0, 10, 30, 0.7);
      color: #8fd0ff;
      font: 14px/1.2 ui-monospace, "Courier New", monospace;
      letter-spacing: 0.05em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.8s ease;
      text-shadow: 0 0 6px #1e90ff;
    }

    #hint.hidden { opacity: 0; }

    body.idle { cursor: none; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div id="hint">Toca o haz doble clic para pantalla completa</div>

  <script>
    (() => {
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d', { alpha: false });
      const hint = document.getElementById('hint');

      // Caracteres: katakana de media anchura + números + algunos símbolos
      const CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>¦｜';

      // Paletas: doble toque / doble clic alterna entre ellas
      const THEMES = [
        { name: 'Azul',  head: '#e6f6ff', trail: '#1e90ff', glow: '#3aa8ff', fade: 'rgba(0, 4, 12, 0.08)' },
        { name: 'Verde', head: '#e8ffe8', trail: '#00e040', glow: '#3cff6e', fade: 'rgba(0, 10, 2, 0.08)' },
        { name: 'Rojo',  head: '#ffeaea', trail: '#ff2a3c', glow: '#ff5a66', fade: 'rgba(12, 0, 2, 0.08)' }
      ];

      let themeIndex = 0;
      try {
        const saved = parseInt(localStorage.getItem('matrixTheme'), 10);
        if (saved >= 0 && saved < THEMES.length) themeIndex = saved;
      } catch (_) { /* almacenamiento no disponible */ }
      let theme = THEMES[themeIndex];

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let width, height, dpr, fontSize, columns, drops, speeds;
      let lastTime = 0;
      let running = true;

      function setup() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Mobile-first: fuente que escala con el ancho de pantalla
        fontSize = Math.round(Math.max(14, Math.min(22, width / 40)));
        columns = Math.ceil(width / fontSize);

        drops = new Array(columns);
        speeds = new Array(columns);
        for (let i = 0; i < columns; i++) {
          drops[i] = Math.random() * -(height / fontSize); // arranque escalonado
          speeds[i] = 0.6 + Math.random() * 0.6;
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${fontSize}px ui-monospace, "MS Gothic", "Courier New", monospace`;
        ctx.textBaseline = 'top';
      }

      function randomChar() {
        return CHARS.charAt(Math.floor(Math.random() * CHARS.length));
      }

      function draw(time) {
        if (!running) return;
        requestAnimationFrame(draw);

        // ~30 fps (más lento si el usuario prefiere menos movimiento)
        const interval = reducedMotion ? 90 : 33;
        if (time - lastTime < interval) return;
        lastTime = time;

        ctx.fillStyle = theme.fade;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < columns; i++) {
          const x = i * fontSize;
          const y = Math.floor(drops[i]) * fontSize;

          if (y >= 0) {
            // Repinta el carácter anterior en azul para que la punta quede blanca
            ctx.shadowBlur = 0;
            ctx.fillStyle = theme.trail;
            ctx.fillText(randomChar(), x, y - fontSize);

            ctx.shadowColor = theme.glow;
            ctx.shadowBlur = 8;
            ctx.fillStyle = theme.head;
            ctx.fillText(randomChar(), x, y);
          }

          drops[i] += speeds[i];

          if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
            speeds[i] = 0.6 + Math.random() * 0.6;
          }
        }
        ctx.shadowBlur = 0;
      }

      // ---------- Pantalla completa ----------
      function isFullscreen() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      function toggleFullscreen() {
        const el = document.documentElement;
        if (!isFullscreen()) {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) req.call(el).catch?.(() => {});
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      }

      // ---------- Mensajes temporales ----------
      let hintTimer;
      function showHint(text, ms) {
        hint.textContent = text;
        hint.style.color = theme.trail;
        hint.style.borderColor = theme.trail;
        hint.style.textShadow = `0 0 6px ${theme.glow}`;
        hint.classList.remove('hidden');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.add('hidden'), ms);
      }

      // ---------- Cambio de color ----------
      function nextTheme() {
        themeIndex = (themeIndex + 1) % THEMES.length;
        theme = THEMES[themeIndex];
        try { localStorage.setItem('matrixTheme', themeIndex); } catch (_) {}
        showHint(theme.name, 1200);
      }

      // Un toque/clic: entra en pantalla completa (si no lo está).
      // Doble toque (móvil) o doble clic (desktop): cambia de color.
      const DOUBLE_TAP_MS = 300;
      let lastTap = 0;
      canvas.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < DOUBLE_TAP_MS) {
          lastTap = 0;
          nextTheme();
          return;
        }
        lastTap = now;
        if (!isFullscreen()) toggleFullscreen();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        if (e.key === 'c' || e.key === 'C') nextTheme();
      });

      // iPhone no soporta Fullscreen API: sugerir "Agregar a inicio"
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const standalone = window.navigator.standalone === true ||
                         window.matchMedia('(display-mode: standalone)').matches;
      if (isIOS && !standalone) {
        showHint('Doble toque: color · Compartir → "Agregar a inicio"', 5000);
      } else if (isTouch) {
        showHint('Toque: pantalla completa · Doble toque: color', 5000);
      } else {
        showHint('Clic o F: pantalla completa · Doble clic o C: color', 5000);
      }

      // ---------- Mantener la pantalla encendida ----------
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (_) { /* no soportado o denegado */ }
      }
      requestWakeLock();
      document.addEventListener('click', requestWakeLock, { once: true });

      // ---------- Pausar en segundo plano ----------
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          running = false;
        } else {
          running = true;
          requestWakeLock();
          requestAnimationFrame(draw);
        }
      });

      // ---------- Ocultar cursor si está inactivo ----------
      let idleTimer;
      document.addEventListener('mousemove', () => {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
      });

      // ---------- Resize / rotación ----------
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(setup, 150);
      });

      setup();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
